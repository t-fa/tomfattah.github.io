<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tom Fattah - Portraits</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      href="/assets/favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Tom Fattah" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Open Graph (Facebook, iMessage, Slack, Discord, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tom Fattah — Artist" />
    <meta property="og:description" content="Portfolio of Tom Fattah." />
    <meta property="og:url" content="https://tomfattah.com/portaits" />
    <meta
      property="og:image"
      content="https://tomfattah.com/images/og-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tom Fattah — Artist" />
    <meta name="twitter:description" content="Portfolio of Tom Fattah." />
    <meta
      name="twitter:image"
      content="https://tomfattah.com/images/og-preview.jpg"
    />

    <meta name="robots" content="noai, noimageai" />
    <meta name="gptbot" content="noindex, nofollow" />
    <meta name="claudebot" content="noindex, nofollow" />
    <meta name="googlebot" content="noai, noml" />
    <meta name="Google-Extended" content="noindex" />
    <meta name="applebot" content="noai" />
    <meta name="Applebot-Extended" content="noindex" />
    <meta name="bingbot" content="noai, noml" />
    <meta name="perplexitybot" content="noindex" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <a class="site-title" href="/">Tom Fattah</a>
      <nav class="site-nav">
        <a href="about">About</a>
      </nav>
    </header>

    <main class="wrap" id="main">
      <div class="section-header">
        <h1>Potraits</h1>
        <p>Portraits done with a hatching technique</p>
      </div>

      <div class="gallery">
        <a href="images/portraits/multiPortrait1.jpg">
          <img
            src="images/portraits/multiPortrait1.jpg"
            alt="Hatced drawing of multiple faces in different colors"
          />
        </a>
        <a href="images/portraits/portrait1.jpg">
          <img
            src="images/portraits/portrait1.jpg"
            alt="Monochrome portrait of a woman"
          />
        </a>
        <a href="images/portraits/portrait2.jpg">
          <img
            src="images/portraits/portrait2.jpg"
            alt="Monochrome portrait of an old man"
          />
        </a>
        <a href="images/portraits/portrait3.jpg">
          <img
            src="images/portraits/portrait3.jpg"
            alt="Monochrome portrait of a woman"
          />
        </a>
        <a href="images/portraits/portrait4.jpg">
          <img
            src="images/portraits/portrait4.jpg"
            alt="Monochrome portrait of a man with sunglasses"
          />
        </a>
        <a href="images/portraits/portrait5.jpg">
          <img
            src="images/portraits/portrait5.jpg"
            alt="Ink and brush self portrait on watercolor paper"
          />
        </a>
        <a href="images/portraits/portrait6.jpg">
          <img
            src="images/portraits/portrait6.jpg"
            alt="Monochrome portrait of a man smoking"
          />
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <ul class="social-links">
        <li>
          <a
            href="https://instagram.com/tomfattah"
            aria-label="Instagram"
            rel="me noopener"
            target="_blank"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
        </li>
      </ul>

      <p>© <span id="year">2026</span> Tom Fattah. All rights reserved.</p>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer"
      hidden
    >
      <button class="lightbox-close" type="button" aria-label="Close">
        &times;
      </button>
      <button class="lightbox-prev" type="button" aria-label="Previous image">
        &lsaquo;
      </button>
      <button class="lightbox-next" type="button" aria-label="Next image">
        &rsaquo;
      </button>
      <figure class="lightbox-figure">
        <img class="lightbox-img" src="" alt="" />
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
    </div>

    <script src="lightbox.js"></script>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
