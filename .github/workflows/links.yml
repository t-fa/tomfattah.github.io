name: Check links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays at 9am UTC

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links and images
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --no-progress
            --verbose
            --root-dir .
            --fallback-extensions html
            './**/*.html'
          fail: true

  live-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Check live site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --verbose
            --max-retries 3
            'https://tomfattah.com'
          fail: false
