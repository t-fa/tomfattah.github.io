live-check:
  runs-on: ubuntu-latest
  if: github.event_name == 'push'
  steps:
    - name: Check live site
      uses: lycheeverse/lychee-action@v2
      with:
        args: >
          --no-progress
          --verbose
          --max-retries 3
          'https://yourdomain.com'
        fail: false
        on:
          pull_request:
            branches: [main]
          push:
            branches: [main]
          schedule:
            - cron: "0 9 * * 1" # Mondays at 9am UTC
