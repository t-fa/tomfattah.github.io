    <link rel="icon" href="/favicon.ico" sizes="32x32" />

      name="twitter:image"
      content="https://tomfattah.com/images/og-preview.jpg"
    />

    <meta name="robots" content="noai, noimageai" />
    <meta name="gptbot" content="noindex, nofollow" />

  <body>
    <header class="site-header">
      <a class="site-title" href="/">Tom Fattah</a>
      <nav class="site-nav">
        <a href="about">About</a>
      </nav>
    </header>

    <main class="wrap">
      <div class="section-header">
        <h1>Botanicals</h1>
        <p>
          I am continually inspired by nature. These are some sketches from my
          sketchbook mostly of the plants in my garden.
        </p>
      </div>

      <div class="gallery">
        <a href="images/botanicals/botanical1.jpeg">
          <img
            src="images/botanicals/botanical1.jpeg"
            alt="Ink and watercolor painting of a snake plant on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical2.jpeg">
          <img
            src="images/botanicals/botanical2.jpeg"
            alt="Ink and watercolor painting of a yellow lily flower on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical3.jpeg">
          <img
            src="images/botanicals/botanical3.jpeg"
            alt="Ink and watercolor painting of a monarch butterfly on a yellow zinnia flower on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical4.jpeg">
          <img
            src="images/botanicals/botanical4.jpeg"
            alt="Ink and watercolor painting of a weed poking out of a brick wall on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical5.jpeg">
          <img
            src="images/botanicals/botanical5.jpeg"
            alt="Ink and watercolor painting of pink zinnia on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical6.jpeg">
          <img
            src="images/botanicals/botanical6.jpeg"
            alt="Ink and watercolor painting of the flowers of a crepe myrtle on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical7.jpeg">
          <img
            src="images/botanicals/botanical7.jpeg"
            alt="Ink and watercolor painting of a red zinnia flower on toned tan paper"
          />
        </a>
        <a href="images/botanicals/botanical8.jpeg">
          <img
            src="images/botanicals/botanical8.jpeg"
            alt="Ink and watercolor painting of a yellow zinnia flower on toned tan paper"
          />
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <ul class="social-links">
        <li>
          <a
            href="https://instagram.com/tomfattah"
            aria-label="Instagram"
            rel="me noopener"
            target="_blank"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
        </li>
      </ul>

      <p>© <span id="year">2026</span> Tom Fattah. All rights reserved.</p>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer"
      hidden
    >
      <button class="lightbox-close" type="button" aria-label="Close">
        &times;
      </button>
      <button class="lightbox-prev" type="button" aria-label="Previous image">
        &lsaquo;
      </button>
      <button class="lightbox-next" type="button" aria-label="Next image">
        &rsaquo;
      </button>
      <figure class="lightbox-figure">
        <img class="lightbox-img" src="" alt="" />
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
    </div>

    <script src="lightbox.js"></script>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
